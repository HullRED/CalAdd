<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hull Red CIO Admin</title>
<link rel="stylesheet" href="style.css">
<style>
/* Login & admin panel styling */
.login-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}

.login-box {
  background: #31303a;
  padding: 24px;
  border-radius: 18px;
  border: 1px solid #3c3a45;
  box-shadow: 0 14px 32px rgba(0,0,0,0.28);
  max-width: 350px;
  width: 100%;
}

.login-box h3 {
  margin: 0 0 16px;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}

.login-box input {
  width: 100%;
  padding: 6px 10px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #3c3a45;
  background: #2a2931;
  color: #fff;
  font-size: 14px;
}

.login-box button {
  width: 100%;
  padding: 6px 14px;
  border: none;
  border-radius: 12px;
  background: #f15f0a;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.login-box button:hover {
  background: rgba(241,1,0,0.85);
}

.admin-panel {
  max-width: 500px;
  margin: 40px auto;
  padding: 24px;
  background: linear-gradient(180deg, #31303a 0%, #2d2c35 100%);
  border-radius: 18px;
  border: 1px solid #3c3a45;
  box-shadow: 0 14px 32px rgba(0,0,0,0.28);
  display: none;
}

.admin-panel h2 {
  margin: 0 0 16px;
  font-size: 22px;
  font-weight: 800;
}

.form-group {
  margin-bottom: 12px;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  color: #cfcfcf;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 6px 10px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid #3c3a45;
  background: #31303a;
  color: #fff;
}

.form-group textarea {
  resize: vertical;
  min-height: 60px;
}

.btn-save {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 14px;
  background: #f15f0a;
  border: none;
  border-radius: 12px;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.btn-save:hover {
  background: rgba(233,1,0,0.85);
}

/* Calendar styles */
.calendar-container {
  margin-top: 12px;
  padding: 14px;
  background: #2a2931;
  border: 1px solid #3c3a45;
  border-radius: 16px;
}

/* Month / nav row if used by JS */
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 12px;
  font-weight: 700;
  color: #fff;
}

/* Days of week row */
.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin-bottom: 10px;
  text-align: center;
}

.calendar-weekday {
  font-size: 12px;
  font-weight: 700;
  color: #cfcfcf;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Calendar dates grid */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

/* Individual day cells */
.calendar-day {
  width: 40px;
  height: 40px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  cursor: pointer;
  background: #31303a;
  border: 1px solid #3c3a45;
  color: #cfcfcf;
  font-size: 14px;
  font-weight: 600;
  transition: 0.2s ease;
  user-select: none;
}

/* Blank spacer cells for alignment */
.calendar-day.empty {
  background: transparent;
  border: none;
  cursor: default;
  box-shadow: none;
}

/* Hover state */
.calendar-day:not(.empty):hover {
  transform: translateY(-2px);
  border-color: #e90100;
  background: linear-gradient(0deg, #e90100 0%, #212026 100%);
  color: #fff;
  box-shadow: 0 4px 10px rgba(233, 1, 0, 0.35);
}

/* Selected date */
.calendar-day.selected {
  background: linear-gradient(0deg, #e90100 0%, #212026 100%);
  border-color: #e90100;
  color: #fff;
  box-shadow: 0 4px 12px rgba(233, 1, 0, 0.35);
}
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h3>Admin Login</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <h2>Edit Event Details</h2>
  <div class="form-group">
  <label for="eventStartTimeInput">Start Time:</label>
  <select id="eventStartTimeInput"></select>
</div>
<div class="form-group">
  <label for="eventEndTimeInput">End Time:</label>
  <select id="eventEndTimeInput"></select>
</div>
  <div class="form-group">
    <label for="eventSubtitleInput">Event Subtitle</label>
    <input type="text" id="eventSubtitleInput">
  </div>
  <div class="form-group">
    <label for="eventDescriptionInput">Event Description</label>
    <textarea id="eventDescriptionInput"></textarea>
  </div>
  <div class="form-group">
    <label for="eventDateInput">Date</label>
    <input type="text" id="eventDateInput" placeholder="e.g., Saturday, 30 May 2026">
    <div class="calendar-container"></div>
  </div>
  <div class="form-group">
    <label for="eventLocationInput">Location</label>
    <input type="text" id="eventLocationInput" placeholder="e.g., Hull, UK">
  </div>
  <button class="btn-save" id="saveBtn">Save Event</button>
</div>

<script src="admin.js"></script>
</body>
</html>
