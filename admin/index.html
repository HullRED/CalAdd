<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hull Red CIO Admin</title>
<link rel="stylesheet" href="../public/style.css" />
<style>
  .admin-panel {
    max-width: 500px;
    margin: 40px auto;
    padding: 24px;
    background: linear-gradient(180deg, #31303a 0%, #2d2c35 100%);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .admin-panel h2 {
    margin: 0 0 16px;
    font-size: 22px;
    font-weight: 800;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--muted);
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 6px 10px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
  }
  .form-group textarea {
    resize: vertical;
    min-height: 60px;
  }
  .btn-save {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 14px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: 0.18s ease;
  }
  .btn-save:hover {
    background: rgba(233,1,0,0.85);
  }

  /* login overlay */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .login-box {
    background: var(--panel-2);
    padding: 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    max-width: 350px;
    width: 100%;
  }
  .login-box h3 {
    margin: 0 0 16px;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .login-box input {
    width: 100%;
    padding: 6px 10px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  .login-box button {
    width: 100%;
    padding: 6px 14px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .login-box button:hover {
    background: rgba(233,1,0,0.85);
  }

  /* Restricted message */
  .restricted {
    max-width: 500px;
    margin: 80px auto;
    padding: 24px;
    background: linear-gradient(180deg, #e90100 0%, var(--bg) 100%);
    border-radius: 20px;
    color: #fff;
    text-align: center;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 8px 20px rgba(233,1,0,0.5);
  }
  .restricted a {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 16px;
    border-radius: 20px;
    background: #212026;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s ease;
  }
  .restricted a:hover {
    background: #e90100;
  }
</style>
</head>
<body>
<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay" style="display:none;">
  <div class="login-box">
    <h3>Admin Login</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>
</div>

<!-- Admin panel -->
<div class="admin-panel" id="adminPanel" style="display:none;">
  <a href="../index.html" class="btn-save" style="background: var(--panel); color: var(--text); margin-bottom:12px; display:block; text-align:center;">← Return to Site</a>

  <h2>Edit Event Details</h2>

  <div class="form-group">
    <label for="eventTitleInput">Event Title</label>
    <input type="text" id="eventTitleInput">
  </div>

  <div class="form-group">
    <label for="eventSubtitleInput">Event Subtitle</label>
    <input type="text" id="eventSubtitleInput">
  </div>

  <div class="form-group">
    <label for="eventDescriptionInput">Event Description</label>
    <textarea id="eventDescriptionInput"></textarea>
  </div>

  <div class="form-group">
    <label for="eventDateInput">Date</label>
    <input type="text" id="eventDateInput">
  </div>

  <div class="form-group">
    <label for="eventTimeInput">Time</label>
    <input type="text" id="eventTimeInput">
  </div>

  <div class="form-group">
    <label for="eventLocationInput">Location</label>
    <input type="text" id="eventLocationInput">
  </div>

  <button class="btn-save" id="saveBtn">Save Event</button>
</div>

<!-- Restricted message -->
<div class="restricted" id="restrictedMessage" style="display:none;">
  Sorry, this page is restricted to Admins of Hull Red CIO ONLY
  <br>
  <a href="../index.html">Return to Home</a>
</div>

<script src="admin.js"></script>
</body>
</html>
