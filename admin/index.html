<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hull Red CIO Admin</title>

<link rel="stylesheet" href="../style.css" />
<style>
/* Centered login overlay */
.login-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}

.login-box {
  background: var(--panel-2);
  padding: 32px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  max-width: 360px;
  width: 100%;
  text-align: center;
}

.login-box h3 {
  margin-bottom: 20px;
  color: var(--text);
  font-size: 22px;
  font-weight: 700;
}

.login-box input {
  width: 90%;
  margin-bottom: 12px;
  padding: 8px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
}

.login-box button {
  width: 50%;
  padding: 8px 12px;
  border: none;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.login-box button:hover {
  background: rgba(233,1,0,0.85);
}

/* Admin panel */
.admin-panel {
  max-width: 520px;
  margin: 40px auto;
  padding: 24px;
  background: linear-gradient(180deg, #31303a 0%, #2d2c35 100%);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.admin-panel h2 {
  margin-bottom: 16px;
  font-size: 22px;
  font-weight: 800;
  text-align: center;
}

.form-group {
  margin-bottom: 16px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--muted);
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 8px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
}

textarea {
  resize: vertical;
  min-height: 60px;
}

/* Buttons */
.btn-save {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  transition: 0.18s ease;
}

.btn-save:hover {
  background: rgba(233,1,0,0.85);
}

/* Return home */
.return-home {
  display: block;
  margin-bottom: 24px;
  padding: 8px 16px;
  border-radius: 12px;
  background: #fff;
  color: #212026;
  text-align: center;
  text-decoration: none;
  font-weight: 700;
}

/* Calendar styles */
#calendar {
  margin-top: 16px;
  text-align: center;
}

#calendar header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 12px;
  margin-bottom: 12px;
}

#calendar header button {
  background: var(--panel-2);
  color: var(--text);
  border: none;
  padding: 4px 8px;
  border-radius: 8px;
  cursor: pointer;
}

#calendar table {
  width: 100%;
  border-collapse: collapse;
}

#calendar th {
  color: var(--muted);
  padding: 6px 0;
}

#calendar td {
  padding: 10px 0;
  text-align: center;
  cursor: pointer;
  border-radius: 50%;
  transition: transform 0.18s ease;
}

/* Selected day - liquid glass effect */
#calendar td.selected {
  background: rgba(233,1,0,0.15);
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 12px rgba(233,1,0,0.4);
  color: #fff;
  transform: scale(1.2);
}
</style>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h3>Admin Login</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </div>
</div>

<div class="admin-panel" id="adminPanel" style="display:none;">
  <a href="../index.html" class="return-home">← Return to Home</a>

  <h2>Edit Event Details</h2>

  <div class="form-group">
    <label for="eventTitleInput">Event Title</label>
    <input type="text" id="eventTitleInput">
  </div>

  <div class="form-group">
    <label for="eventSubtitleInput">Event Subtitle</label>
    <input type="text" id="eventSubtitleInput">
  </div>

  <div class="form-group">
    <label for="eventDescriptionInput">Event Description</label>
    <textarea id="eventDescriptionInput"></textarea>
  </div>

  <div class="form-group">
    <label for="eventDateInput">Date</label>
    <input type="text" id="eventDateInput" placeholder="Select a date">
    <div id="calendar"></div>
  </div>

  <div class="form-group">
    <label for="eventTimeInput">Time</label>
    <input type="text" id="eventTimeInput" placeholder="e.g., 19:30 – 23:00">
  </div>

  <div class="form-group">
    <label for="eventLocationInput">Location</label>
    <input type="text" id="eventLocationInput" placeholder="e.g., Hull, UK">
  </div>

  <button class="btn-save" id="saveBtn">Save Event</button>
</div>

<script src="../admin.js"></script>
</body>
</html>
