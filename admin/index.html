<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Hull Red CIO Admin</title>
  <link rel="stylesheet" href="../public/style.css" />
  <style>
    .admin-panel {
      max-width: 500px;
      margin: 40px auto;
      padding: 24px;
      background: linear-gradient(180deg, #31303a 0%, #2d2c35 100%);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .admin-panel h2 {
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 6px 10px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .btn-save {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .btn-save:hover {
      background: rgba(233,1,0,0.85);
    }

    /* login overlay */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .login-box {
      background: var(--panel-2);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      max-width: 350px;
      width: 100%;
    }

    .login-box h3 {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .login-box input {
      width: 100%;
      padding: 6px 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }

    .login-box button {
      width: 100%;
      padding: 6px 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .login-box button:hover {
      background: rgba(233,1,0,0.85);
    }
  </style>
</head>
<body>
  <!-- Login overlay -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h3>Admin Login</h3>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <p id="loginError" style="color: #e90100; font-weight: 700; margin-top:8px; display:none;">Sorry, this page is restricted to Admins of Hull Red CIO ONLY</p>
    </div>
  </div>

  <div class="admin-panel" id="adminPanel" style="display:none;">
    <a href="../index.html" class="btn-save" style="background: var(--panel); color: var(--text); margin-bottom:12px; text-align:center; display:block;">← Return to Site</a>

    <h2>Edit Event Details</h2>

    <div class="form-group">
      <label for="eventTitleInput">Event Title</label>
      <input type="text" id="eventTitleInput">
    </div>

    <div class="form-group">
      <label for="eventSubtitleInput">Event Subtitle</label>
      <input type="text" id="eventSubtitleInput">
    </div>

    <div class="form-group">
      <label for="eventDescriptionInput">Event Description</label>
      <textarea id="eventDescriptionInput"></textarea>
    </div>

    <div class="form-group">
      <label for="eventDateInput">Date</label>
      <input type="text" id="eventDateInput" placeholder="e.g., Saturday, 30 May 2026">
    </div>

    <div class="form-group">
      <label for="eventTimeInput">Time</label>
      <input type="text" id="eventTimeInput" placeholder="e.g., 18:00 – 21:00">
    </div>

    <div class="form-group">
      <label for="eventLocationInput">Location</label>
      <input type="text" id="eventLocationInput" placeholder="e.g., Hull, UK">
    </div>

    <button class="btn-save" id="saveBtn">Save Event</button>
    <p id="saveStatus" style="margin-top:10px;"></p>
  </div>

<script>
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'password';

const loginOverlay = document.getElementById('loginOverlay');
const adminPanel = document.getElementById('adminPanel');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

loginBtn.addEventListener('click', () => {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  if(username === ADMIN_USER && password === ADMIN_PASS){
    loginOverlay.style.display = 'none';
    adminPanel.style.display = 'block';
    loadEvent();
  } else {
    loginError.style.display = 'block';
  }
});

// Load event.json into form
function loadEvent(){
  fetch('../data/event.json')
    .then(res => res.json())
    .then(data => {
      document.getElementById('eventTitleInput').value = data.title;
      document.getElementById('eventSubtitleInput').value = data.subtitle;
      document.getElementById('eventDescriptionInput').value = data.description;
      document.getElementById('eventDateInput').value = data.date;
      document.getElementById('eventTimeInput').value = data.time;
      document.getElementById('eventLocationInput').value = data.location;
    });
}

// Save event locally (only works with Node.js server)
document.getElementById('saveBtn').addEventListener('click', () => {
  const eventData = {
    title: document.getElementById('eventTitleInput').value,
    subtitle: document.getElementById('eventSubtitleInput').value,
    description: document.getElementById('eventDescriptionInput').value,
    date: document.getElementById('eventDateInput').value,
    time: document.getElementById('eventTimeInput').value,
    location: document.getElementById('eventLocationInput').value
  };

  fetch('/admin/save-event', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(eventData)
  }).then(res => res.json())
    .then(resp => {
      document.getElementById('saveStatus').innerText = resp.message;
    }).catch(err => {
      document.getElementById('saveStatus').innerText = 'Failed to save event locally.';
    });
});
</script>
</body>
</html>
