<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Hull Red CIO Admin</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="nav-brand">
        <div class="nav-logo">
          <img src="../HullRed2.png" alt="Hull Red CIO Logo">
        </div>
        <div class="nav-title">Hull Red CIO Admin</div>
      </div>

      <nav class="nav-links">
        <a href="../">Back to Event</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="login-box" id="loginBox">
      <div class="admin-card">
        <h1 class="admin-title">Admin Login</h1>
        <p class="admin-subtitle">Static version only.</p>

        <div class="form-grid">
          <div class="form-row">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" />
          </div>

          <div class="form-row">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" />
          </div>
        </div>

        <div class="admin-actions">
          <button class="btn btn-primary" id="loginBtn">Login</button>
        </div>

        <div class="notice" id="loginNotice"></div>
      </div>
    </div>

    <div class="admin-shell hidden" id="adminShell">
      <div class="admin-card">
        <h1 class="admin-title">Edit Event</h1>
        <p class="admin-subtitle">Update the public event details shown on the main page.</p>

        <div class="form-grid">
          <div class="form-row">
            <label for="title">Event Title</label>
            <input type="text" id="title" />
          </div>

          <div class="form-row">
            <label for="subtitle">Subtitle</label>
            <input type="text" id="subtitle" />
          </div>

          <div class="form-row two-col">
            <div class="form-row">
              <label for="startDate">Start Date</label>
              <input type="date" id="startDate" />
            </div>

            <div class="form-row">
              <label for="startTime">Start Time</label>
              <input type="time" id="startTime" />
            </div>
          </div>

          <div class="form-row two-col">
            <div class="form-row">
              <label for="endDate">End Date</label>
              <input type="date" id="endDate" />
            </div>

            <div class="form-row">
              <label for="endTime">End Time</label>
              <input type="time" id="endTime" />
            </div>
          </div>

          <div class="form-row">
            <label for="location">Location</label>
            <input type="text" id="location" />
          </div>

          <div class="form-row">
            <label for="description">Description</label>
            <textarea id="description"></textarea>
          </div>
        </div>

        <div class="admin-actions">
          <button class="btn btn-primary" id="saveBtn">Save Event</button>
          <button class="btn" id="resetBtn">Reset to Default</button>
          <button class="btn" id="logoutBtn">Logout</button>
        </div>

        <div class="notice" id="saveNotice"></div>
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
