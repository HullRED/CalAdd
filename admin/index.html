<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hull Red CIO Admin</title>
<link rel="stylesheet" href="../public/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="nav-brand">
      <div class="nav-logo">
        <img src="../public/HullRed2.png" alt="Hull Red CIO Logo">
      </div>
      <div class="nav-title">Admin Panel</div>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Return to Site</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="panel">
    <h2>Update Event Details</h2>
    <form id="eventForm">
      <label>Title: <input type="text" name="title"></label><br>
      <label>Subtitle: <input type="text" name="subtitle"></label><br>
      <label>Description: <textarea name="description"></textarea></label><br>
      <label>Date: <input type="text" name="date"></label><br>
      <label>Time: <input type="text" name="time"></label><br>
      <label>Location: <input type="text" name="location"></label><br>
      <button type="submit">Save Event</button>
    </form>
    <p id="status"></p>
  </div>
</main>

<script>
async function loadEvent() {
  const res = await fetch('../data/event.json');
  const data = await res.json();
  const form = document.getElementById('eventForm');
  Object.keys(data).forEach(key => {
    if(form[key]) form[key].value = data[key];
  });
}
loadEvent();

document.getElementById('eventForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  const eventData = {};
  Object.keys(form.elements).forEach(key => {
    if(form.elements[key].name) eventData[form.elements[key].name] = form.elements[key].value;
  });
  const res = await fetch('/admin/save-event', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(eventData)
  });
  const result = await res.json();
  document.getElementById('status').innerText = result.message;
});
</script>
</body>
</html>
