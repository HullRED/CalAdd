<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Hull Red CIO Event</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="nav-brand">
        <div class="nav-logo">
          <img src="HullRed2.png" alt="Hull Red CIO Logo">
        </div>
        <div class="nav-title">Hull Red CIO</div>
      </div>

      <nav class="nav-links">
        <a href="./">Home</a>
        <a href="admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="brand">
        <div class="logo">
          <img src="HullRed2.png" alt="Hull Red CIO Logo">
        </div>

        <div class="brand-text">
          <h1 id="eventTitle">Hull Red CIO Event</h1>
          <p class="subtitle" id="eventSubtitle">Add this event to your calendar.</p>
        </div>
      </div>

      <div class="panel event-panel">
        <div class="event-grid">
          <div class="event-row">
            <span class="label">Date</span>
            <span class="value" id="eventDate">Saturday, 30 May 2026</span>
          </div>

          <div class="event-row">
            <span class="label">Time</span>
            <span class="value" id="eventTime">18:00 – 21:00</span>
          </div>

          <div class="event-row">
            <span class="label">Location</span>
            <span class="value" id="eventLocation">Hull, United Kingdom</span>
          </div>

          <div class="event-row event-row-description">
            <span class="label">Details</span>
            <span class="value" id="eventDescription">Hull Red CIO event.</span>
          </div>
        </div>

        <div class="calendar-actions">
          <a id="btnApple" class="calendar-btn" href="#" target="_blank" rel="noopener">
            <img src="icons/apple.svg" alt="Apple icon">
            <span>Apple</span>
          </a>

          <a id="btnGoogle" class="calendar-btn" href="#" target="_blank" rel="noopener">
            <img src="icons/google.svg" alt="Google icon">
            <span>Google</span>
          </a>

          <a id="btnOffice365" class="calendar-btn" href="#" target="_blank" rel="noopener">
            <img src="icons/office365.svg" alt="Office 365 icon">
            <span>Office 365</span>
          </a>

          <a id="btnOutlook" class="calendar-btn" href="#" target="_blank" rel="noopener">
            <img src="icons/outlook.svg" alt="Outlook icon">
            <span>Outlook</span>
          </a>

          <a id="btnYahoo" class="calendar-btn" href="#" target="_blank" rel="noopener">
            <img src="icons/yahoo.svg" alt="Yahoo icon">
            <span>Yahoo</span>
          </a>

          <a id="btnICS" class="calendar-btn" href="#" download="hull-red-cio-event.ics">
            <img src="icons/ics.svg" alt="ICS icon">
            <span>ICS</span>
          </a>
        </div>
      </div>
    </section>

    <div class="footer">
      © 2026 Hull Red CIO • Event Calendar Page
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
