<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hull Red CIO Event</title>
<link rel="stylesheet" href="public/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="nav-brand">
      <div class="nav-logo">
        <img src="public/HullRed2.png" alt="Hull Red CIO Logo">
      </div>
      <div class="nav-title">Hull Red CIO</div>
    </div>

    <nav class="nav-links">
      <a href="admin/index.html" class="admin-btn">Admin</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div class="panel">
      <div class="brand">
        <div class="logo">
          <img src="public/HullRed2.png" alt="Hull Red CIO Logo">
        </div>
        <div class="brand-text">
          <h1 id="eventTitle">Hull Red: Event Loading...</h1>
          <p class="subtitle" id="eventSubtitle">Add this event to your calendar</p>
        </div>
      </div>

      <div class="event-grid-map">
        <div class="event-details">
          <p><strong>Date:</strong> <span id="eventDate">Loading...</span></p>
          <p><strong>Time:</strong> <span id="eventTime">Loading...</span></p>
          <p><strong>Location:</strong> <span id="eventLocation">Loading...</span></p>
          <div class="map-buttons">
            <a id="mapGoogle" href="#" target="_blank" class="map-btn">Show on Google Maps</a>
            <a id="mapApple" href="#" target="_blank" class="map-btn">Show on Apple Maps</a>
          </div>
        </div>
      </div>

      <div class="calendar-actions">
        <a class="calendar-btn" href="#" id="appleBtn"><img src="public/icons/apple.svg" alt="Apple"><span>Apple</span></a>
        <a class="calendar-btn" href="#" id="googleBtn"><img src="public/icons/google.svg" alt="Google"><span>Google</span></a>
        <a class="calendar-btn" href="#" id="officeBtn"><img src="public/icons/office365.svg" alt="Office 365"><span>Office 365</span></a>
        <a class="calendar-btn" href="#" id="outlookBtn"><img src="public/icons/outlook.svg" alt="Outlook"><span>Outlook</span></a>
        <a class="calendar-btn" href="#" id="yahooBtn"><img src="public/icons/yahoo.svg" alt="Yahoo"><span>Yahoo</span></a>
        <a class="calendar-btn" href="#" id="icsBtn"><img src="public/icons/ics.svg" alt="ICS"><span>ICS</span></a>
      </div>
    </div>
  </section>

  <div class="footer">
    © 2026 Hull Red CIO • Event Calendar Page
  </div>
</main>

<script>
fetch('public/event.json')
  .then(res => res.json())
  .then(event => {
    // Update title with "Hull Red: [description]"
    document.getElementById('eventTitle').innerText = `Hull Red: ${event.description}`;
    document.getElementById('eventSubtitle').innerText = event.subtitle;
    document.getElementById('eventDate').innerText = event.date;
    document.getElementById('eventTime').innerText = event.time;
    document.getElementById('eventLocation').innerText = event.location;

    // Convert date/time into ICS format (YYYYMMDDTHHMMSS)
    // Simple static example; for production, parse properly
    const start = "20260508T193000"; // Replace with dynamic parsing if needed
    const end = "20260508T230000";

    const title = encodeURIComponent(event.title || "Hull Red CIO Event");
    const description = encodeURIComponent(event.description);
    const location = encodeURIComponent(event.location);

    // Map links
    const googleUrl = `https://www.google.com/maps/search/?api=1&query=${location}`;
    const appleUrl = `https://maps.apple.com/?q=${location}`;
    document.getElementById('mapGoogle').href = googleUrl;
    document.getElementById('mapApple').href = appleUrl;

    // Calendar buttons
    document.getElementById('appleBtn').href = 'public/apple.ics';
    document.getElementById('googleBtn').href = 
      `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${description}&location=${location}&sf=true&output=xml`;
    document.getElementById('officeBtn').href = 'public/office365.ics';
    document.getElementById('outlookBtn').href = 'public/outlook.ics';
    document.getElementById('yahooBtn').href = 
      `https://calendar.yahoo.com/?v=60&TITLE=${title}&ST=${start}&ET=${end}&DESC=${description}&in_loc=${location}`;
    document.getElementById('icsBtn').href = 'public/event.ics';
  })
  .catch(err => console.log('Could not load event.json:', err));
</script>
</body>
</html>
