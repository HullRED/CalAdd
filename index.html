<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hull Red CIO Event</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- BACKGROUND BLOBS -->
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<!-- POSTER MODAL -->
<div class="poster-modal" id="posterModal">
  <span class="poster-close" id="posterClose">&times;</span>
  <img src="public/poster.png" class="poster-full" alt="Poster">
</div>

<header class="topbar">
  <div class="top-inner">

    <div class="brand-mini">
      <img src="public/HullRed2.png">
      <span>Hull Red CIO</span>
    </div>

    <nav class="nav">
      <a href="#">EVENT</a>
      <a href="#">MAP</a>
      <a href="#">INFO</a>
      <a href="admin/index.html" class="admin-btn">ADMIN</a>
    </nav>

  </div>
</header>

<main class="wrap">

<section class="glass-panel">

<div class="hero-grid">

<!-- LEFT -->
<div class="left">

<h1 id="eventTitle">Loading...</h1>
<p class="subtitle" id="eventSubtitle">Please wait...</p>

<div class="clock-card">
<div class="clock-label">EVENT STARTS IN</div>

<div class="flip-clock">
<div class="digit"><span id="h1">0</span></div>
<div class="digit"><span id="h2">0</span></div>

<div class="colon">:</div>

<div class="digit"><span id="m1">0</span></div>
<div class="digit"><span id="m2">0</span></div>

<div class="colon">:</div>

<div class="digit"><span id="s1">0</span></div>
<div class="digit"><span id="s2">0</span></div>
</div>
</div>

<div class="details-card">

<div class="row">
<label>Date</label>
<span id="eventDate"></span>
</div>

<div class="row">
<label>Time</label>
<span id="eventTime"></span>
</div>

<div class="row">
<label>Location</label>
<span id="eventLocation"></span>
</div>

<p id="eventDescription"></p>

</div>

<div class="button-grid">

<a id="googleMapLink" class="tile-btn">
<img src="public/icons/googlemaps.png">
<span>Google Maps</span>
</a>

<a id="appleMapLink" class="tile-btn">
<img src="public/icons/applemaps.png">
<span>Apple Maps</span>
</a>

<a id="appleLink" class="tile-btn">
<img src="public/icons/apple.svg">
<span>Apple</span>
</a>

<a id="googleLink" class="tile-btn">
<img src="public/icons/google.svg">
<span>Google</span>
</a>

<a id="officeLink" class="tile-btn">
<img src="public/icons/office365.svg">
<span>Office 365</span>
</a>

<a id="outlookLink" class="tile-btn">
<img src="public/icons/outlook.svg">
<span>Outlook</span>
</a>

<a id="yahooLink" class="tile-btn">
<img src="public/icons/yahoo.svg">
<span>Yahoo</span>
</a>

<a id="icsLink" class="tile-btn">
<img src="public/icons/ics.svg">
<span>ICS</span>
</a>

</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="poster-card">
<div class="poster-top">
<h3>Live Event Poster</h3>
</div>

<img src="public/poster.png" id="posterThumb" class="poster">

</div>

</div>

</div>

</section>

<footer>
© 2026 Hull Red CIO
</footer>

</main>

<script src="script.js"></script>
</body>
</html>
