<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hull Red CIO Event</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Poster Modal -->
<div class="poster-modal" id="posterModal">
  <span class="poster-close" id="posterClose">&times;</span>
  <img src="public/poster.png" class="poster-full" alt="Poster Fullscreen">
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="nav-brand">
      <div class="nav-logo">
        <img src="public/HullRed2.png" alt="Logo">
      </div>
      <div class="nav-title">Hull Red CIO</div>
    </div>

    <nav class="nav-links">
      <a href="admin/index.html" class="admin-btn">Admin</a>
    </nav>
  </div>
</header>

<main class="container">

<section class="hero">
<div class="panel">

<!-- Title + Poster -->
<div class="brand">

  <div class="brand-left">

    <div class="logo">
      <img src="public/HullRed2.png" alt="Logo">
    </div>

    <div class="brand-text">
      <h1 id="eventTitle">Loading Event...</h1>
      <p class="subtitle" id="eventSubtitle">Please wait</p>
    </div>

  </div>

  <div class="brand-poster-wrap">
    <img src="public/poster.png"
         class="brand-poster"
         id="posterThumb"
         alt="Poster">
  </div>

</div>

<!-- Event Details -->
<div class="event-details">

<p><strong>Date:</strong> <span id="eventDate"></span></p>
<p><strong>Time:</strong> <span id="eventTime"></span></p>
<p><strong>Location:</strong> <span id="eventLocation"></span></p>

<p id="eventDescription"></p>

<p>
<a id="googleMapLink" class="map-btn" target="_blank">Google Maps</a>
<a id="appleMapLink" class="map-btn" target="_blank">Apple Maps</a>
</p>

</div>

<!-- Calendar Buttons -->
<div class="calendar-actions">

<a id="appleLink" class="calendar-btn">Apple</a>
<a id="googleLink" class="calendar-btn">Google</a>
<a id="officeLink" class="calendar-btn">Office 365</a>
<a id="outlookLink" class="calendar-btn">Outlook</a>
<a id="yahooLink" class="calendar-btn">Yahoo</a>
<a id="icsLink" class="calendar-btn">ICS</a>

</div>

</div>
</section>

<div class="footer">
© 2026 Hull Red CIO • Event Calendar Page
</div>

</main>

<script>
fetch("data/event.json")
.then(res => res.json())
.then(event => {

document.getElementById("eventTitle").innerText = event.title;
document.getElementById("eventSubtitle").innerText = event.subtitle;
document.getElementById("eventDescription").innerText = event.description;
document.getElementById("eventLocation").innerText = event.location;

const startDate = new Date(event.date + "T" + event.startTime);
const endDate   = new Date(event.date + "T" + event.endTime);

document.getElementById("eventDate").innerText =
startDate.toLocaleDateString("en-GB");

document.getElementById("eventTime").innerText =
event.startTime + " – " + event.endTime;

const loc = encodeURIComponent(event.location);

document.getElementById("googleMapLink").href =
`https://www.google.com/maps/search/?api=1&query=${loc}`;

document.getElementById("appleMapLink").href =
`https://maps.apple.com/?q=${loc}`;

const start = startDate.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
const end = endDate.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";

const title = encodeURIComponent(event.title);
const desc = encodeURIComponent(event.subtitle + "\n" + event.description);
const location = encodeURIComponent(event.location);

/* Web calendars */
document.getElementById("googleLink").href =
`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${desc}&location=${location}`;

document.getElementById("outlookLink").href =
`https://outlook.live.com/owa/?rru=addevent&subject=${title}&startdt=${startDate.toISOString()}&enddt=${endDate.toISOString()}&location=${location}&body=${desc}`;

document.getElementById("officeLink").href =
`https://outlook.office.com/owa/?path=/calendar/action/compose&subject=${title}&startdt=${startDate.toISOString()}&enddt=${endDate.toISOString()}&location=${location}&body=${desc}`;

document.getElementById("yahooLink").href =
`https://calendar.yahoo.com/?v=60&title=${title}&st=${start.replace("Z","")}&et=${end.replace("Z","")}&desc=${desc}&in_loc=${location}`;

/* ICS */
const ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Hull Red CIO//EN
BEGIN:VEVENT
UID:${Date.now()}@hullred.co.uk
DTSTAMP:${start}
DTSTART:${start}
DTEND:${end}
SUMMARY:${event.title}
DESCRIPTION:${event.subtitle}\\n${event.description}
LOCATION:${event.location}
END:VEVENT
END:VCALENDAR`;

const blob = new Blob([ics], {type:"text/calendar"});
const url = URL.createObjectURL(blob);

document.getElementById("icsLink").href = url;
document.getElementById("icsLink").download = "event.ics";

document.getElementById("appleLink").href = url;
document.getElementById("appleLink").download = "event.ics";

});

/* Poster Modal */
const posterThumb = document.getElementById("posterThumb");
const posterModal = document.getElementById("posterModal");
const posterClose = document.getElementById("posterClose");

posterThumb.onclick = () => posterModal.classList.add("show");
posterClose.onclick = () => posterModal.classList.remove("show");

posterModal.onclick = (e) => {
if(e.target === posterModal){
posterModal.classList.remove("show");
}
};
</script>

</body>
</html>
