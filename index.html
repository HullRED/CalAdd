<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Hull Red CIO Event</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="nav-brand">
        <div class="nav-logo">
          <img src="HullRed2.png" alt="Hull Red CIO Logo">
        </div>
        <div class="nav-title">Hull Red CIO</div>
      </div>

      <nav class="nav-links">
        <a href="./">Home</a>
        <a href="admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="panel">
        <div class="brand" style="margin-bottom:16px;">
          <div class="logo" style="width:60px; height:60px;">
            <img src="HullRed2.png" alt="Hull Red CIO Logo">
          </div>
          <div class="brand-text">
            <h1 id="eventTitle" style="font-size:24px;">Hull Red CIO Event</h1>
            <p class="subtitle" id="eventSubtitle" style="font-size:14px;">Add this event to your calendar</p>
          </div>
        </div>

        <p class="intro" id="eventDescription" style="margin-bottom:16px;">
          Hull Red CIO event.
        </p>

        <div class="calendar-actions">
          <a id="btnApple" class="calendar-btn" href="#"><img src="icons/apple.svg" alt="Apple"><span>Apple</span></a>
          <a id="btnGoogle" class="calendar-btn" href="#"><img src="icons/google.svg" alt="Google"><span>Google</span></a>
          <a id="btnOffice365" class="calendar-btn" href="#"><img src="icons/office365.svg" alt="Office 365"><span>Office 365</span></a>
          <a id="btnOutlook" class="calendar-btn" href="#"><img src="icons/outlook.svg" alt="Outlook"><span>Outlook</span></a>
          <a id="btnYahoo" class="calendar-btn" href="#"><img src="icons/yahoo.svg" alt="Yahoo"><span>Yahoo</span></a>
          <a id="btnICS" class="calendar-btn" href="#" download="hull-red-cio-event.ics"><img src="icons/ics.svg" alt="ICS"><span>ICS</span></a>
        </div>
      </div>
    </section>

    <div class="footer">
      © 2026 Hull Red CIO • Event Calendar Page
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
