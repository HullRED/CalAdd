<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hull Red CIO Event</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="nav-brand">
      <div class="nav-logo">
        <img src="public/HullRed2.png" alt="Hull Red CIO Logo">
      </div>
      <div class="nav-title">Hull Red CIO</div>
    </div>
    <nav class="nav-links">
      <a href="admin/index.html" class="admin-btn">Admin</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div class="panel">
      <div class="brand">
        <div class="logo">
          <img src="public/HullRed2.png" alt="Hull Red CIO Logo">
        </div>
        <div class="brand-text">
          <h1 id="eventTitle">Hull Red: Event Description</h1>
          <p class="subtitle" id="eventSubtitle">Add this event to your calendar</p>
        </div>
      </div>

      <div class="event-grid-map">
        <div class="event-details">
          <p><strong>Date:</strong> <span id="eventDate"></span></p>
          <p><strong>Time:</strong> <span id="eventTime"></span></p>
          <p><strong>Location:</strong> <span id="eventLocation"></span></p>
          <p id="eventDescription"></p>
          <p>
            <a id="googleMapLink" class="map-btn" target="_blank">Show on Google Maps</a>
            <a id="appleMapLink" class="map-btn" target="_blank">Show on Apple Maps</a>
          </p>
        </div>
      </div>

      <div class="calendar-actions">
        <a id="appleLink" class="calendar-btn"><img src="public/icons/apple.svg" alt="Apple">Apple</a>
        <a id="googleLink" class="calendar-btn"><img src="public/icons/google.svg" alt="Google">Google</a>
        <a id="officeLink" class="calendar-btn"><img src="public/icons/office365.svg" alt="Office 365">Office 365</a>
        <a id="outlookLink" class="calendar-btn"><img src="public/icons/outlook.svg" alt="Outlook">Outlook</a>
        <a id="yahooLink" class="calendar-btn"><img src="public/icons/yahoo.svg" alt="Yahoo">Yahoo</a>
        <a id="icsLink" class="calendar-btn"><img src="public/icons/ics.svg" alt="ICS">ICS</a>
      </div>
    </div>
  </section>

  <div class="footer">
    © 2026 Hull Red CIO • Event Calendar Page
  </div>
</main>

<script>
fetch('data/event.json')
  .then(res => res.json())
  .then(event => {
    document.getElementById('eventTitle').innerText = `Hull Red: ${event.description}`;
    document.getElementById('eventSubtitle').innerText = event.subtitle;
    document.getElementById('eventDescription').innerText = event.description;
    document.getElementById('eventDate').innerText = event.date;
    document.getElementById('eventTime').innerText = event.time;
    document.getElementById('eventLocation').innerText = event.location;

    const loc = encodeURIComponent(event.location);
    document.getElementById('googleMapLink').href = `https://www.google.com/maps/search/?api=1&query=${loc}`;
    document.getElementById('appleMapLink').href = `https://maps.apple.com/?q=${loc}`;

    // Calendar links
    const details = {
      title: `Hull Red: ${event.description}`,
      start: new Date(`${event.date} ${event.time.split('–')[0]}`).toISOString(),
      end: new Date(`${event.date} ${event.time.split('–')[1]}`).toISOString(),
      location: event.location,
      description: event.description
    };

    // Apple - ICS
    document.getElementById('appleLink').href = `data:text/calendar;charset=utf8,${encodeURIComponent(`BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:${details.title}
DTSTART:${details.start.replace(/[-:]/g,'')}
DTEND:${details.end.replace(/[-:]/g,'')}
LOCATION:${details.location}
DESCRIPTION:${details.description}
END:VEVENT
END:VCALENDAR`)}`;

    // Google
    const gLink = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(details.title)}&dates=${details.start.replace(/[-:]/g,'')}/${details.end.replace(/[-:]/g,'')}&details=${encodeURIComponent(details.description)}&location=${encodeURIComponent(details.location)}`;
    document.getElementById('googleLink').href = gLink;

    // Office 365
    const officeLink = `https://outlook.office.com/owa/?path=/calendar/action/compose&subject=${encodeURIComponent(details.title)}&startdt=${details.start}&enddt=${details.end}&body=${encodeURIComponent(details.description)}&location=${encodeURIComponent(details.location)}`;
    document.getElementById('officeLink').href = officeLink;

    // Outlook.com
    const outlookLink = `https://outlook.live.com/owa/?rru=addevent&subject=${encodeURIComponent(details.title)}&startdt=${details.start}&enddt=${details.end}&location=${encodeURIComponent(details.location)}&body=${encodeURIComponent(details.description)}`;
    document.getElementById('outlookLink').href = outlookLink;

    // Yahoo
    const yahooLink = `https://calendar.yahoo.com/?v=60&title=${encodeURIComponent(details.title)}&st=${details.start}&et=${details.end}&desc=${encodeURIComponent(details.description)}&in_loc=${encodeURIComponent(details.location)}`;
    document.getElementById('yahooLink').href = yahooLink;

    // ICS fallback
    document.getElementById('icsLink').href = document.getElementById('appleLink').href;

    // Add hover + selected effect
    document.querySelectorAll('.calendar-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.calendar-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  });
</script>
</body>
</html>
