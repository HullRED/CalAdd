<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hull Red CIO Event</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<!-- POSTER MODAL -->
<div class="poster-modal" id="posterModal">
  <span class="poster-close" id="posterClose">&times;</span>
  <img src="public/poster.png" class="poster-full">
</div>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand-mini">
      <img src="public/HullRed2.png">
      <span>Hull Red CIO</span>
    </div>

    <nav class="nav-links">
      <a href="admin/index.html" class="admin-btn">Admin</a>
    </nav>

  </div>
</header>

<main class="container">

<section class="hero-panel">

<div class="main-grid">

<!-- LEFT -->
<div class="left-col">

<h1 id="eventTitle">Loading...</h1>
<p class="subtitle" id="eventSubtitle">Please wait...</p>

<!-- CLOCK -->
<div class="count-wrap">
<div class="count-label">EVENT STARTS IN</div>
<div id="countdown" class="flip-clock"></div>
</div>

<!-- DETAILS -->
<div class="details-box">

<div class="detail-row">
<label>Date</label>
<span id="eventDate"></span>
</div>

<div class="detail-row">
<label>Time</label>
<span id="eventTime"></span>
</div>

<div class="detail-row">
<label>Location</label>
<span id="eventLocation"></span>
</div>

<p id="eventDescription"></p>

</div>

<!-- BUTTONS -->
<div class="button-grid">

<a id="googleMapLink" class="action-btn">
<img src="public/icons/google-maps.svg">
<span>Google Maps</span>
</a>

<a id="appleMapLink" class="action-btn">
<img src="public/icons/apple-maps.svg">
<span>Apple Maps</span>
</a>

<a id="appleLink" class="action-btn">
<img src="public/icons/apple.svg">
<span>Apple</span>
</a>

<a id="googleLink" class="action-btn">
<img src="public/icons/google.svg">
<span>Google</span>
</a>

<a id="officeLink" class="action-btn">
<img src="public/icons/office365.svg">
<span>Office 365</span>
</a>

<a id="outlookLink" class="action-btn">
<img src="public/icons/outlook.svg">
<span>Outlook</span>
</a>

<a id="yahooLink" class="action-btn">
<img src="public/icons/yahoo.svg">
<span>Yahoo</span>
</a>

<a id="icsLink" class="action-btn">
<img src="public/icons/ics.svg">
<span>ICS</span>
</a>

</div>

</div>

<!-- RIGHT -->
<div class="right-col">

<div class="poster-box">
<div class="poster-head">Live Event Poster</div>
<img src="public/poster.png" id="posterThumb" class="poster-img">
</div>

</div>

</div>

</section>

<footer class="footer">
© 2026 Hull Red CIO
</footer>

</main>

<script src="script.js"></script>
</body>
</html>
