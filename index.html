<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hull Red CIO Event</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="nav-brand">
      <div class="nav-logo">
        <img src="public/HullRed2.png" alt="Hull Red CIO Logo">
      </div>
      <div class="nav-title">Hull Red CIO</div>
    </div>
    <nav class="nav-links">
      <a href="admin/index.html" class="admin-btn">Admin</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div class="panel">
      <div class="brand">
        <div class="logo">
          <img src="public/HullRed2.png" alt="Hull Red CIO Logo">
        </div>
        <div class="brand-text">
          <h1 id="eventTitle">Hull Red: Event Description</h1>
          <p class="subtitle" id="eventSubtitle">Add this event to your calendar</p>
        </div>
      </div>

      <div class="event-grid-map">
        <div class="event-details">
          <p><strong>Date:</strong> <span id="eventDate"></span></p>
          <p><strong>Time:</strong> <span id="eventTime"></span></p>
          <p><strong>Location:</strong> <span id="eventLocation"></span></p>
          <p id="eventDescription"></p>
          <p>
            <a id="googleMapLink" class="map-btn" target="_blank">Show on Google Maps</a>
            <a id="appleMapLink" class="map-btn" target="_blank">Show on Apple Maps</a>
          </p>
        </div>
      </div>

      <div class="calendar-actions">
        <a id="appleLink" class="calendar-btn"><img src="public/icons/apple.svg" alt="Apple"><span>Apple</span></a>
        <a id="googleLink" class="calendar-btn"><img src="public/icons/google.svg" alt="Google"><span>Google</span></a>
        <a id="officeLink" class="calendar-btn"><img src="public/icons/office365.svg" alt="Office 365"><span>Office 365</span></a>
        <a id="outlookLink" class="calendar-btn"><img src="public/icons/outlook.svg" alt="Outlook"><span>Outlook</span></a>
        <a id="yahooLink" class="calendar-btn"><img src="public/icons/yahoo.svg" alt="Yahoo"><span>Yahoo</span></a>
        <a id="icsLink" class="calendar-btn"><img src="public/icons/ics.svg" alt="ICS"><span>ICS</span></a>
      </div>
    </div>
  </section>

  <div class="footer">
    © 2026 Hull Red CIO • Event Calendar Page
  </div>
</main>

<script>
const basePath = 'data/event.json';
const hostedIcsPath = 'data/event.ics'; // Optional: create this file if you want direct Apple Calendar opening

fetch(basePath)
  .then(res => {
    if (!res.ok) throw new Error('Could not load event.json');
    return res.json();
  })
  .then(event => {
    // Fill event details
    document.getElementById('eventTitle').innerText = event.title || '';
    document.getElementById('eventSubtitle').innerText = event.subtitle || '';
    document.getElementById('eventDescription').innerText = event.description || '';
    document.getElementById('eventLocation').innerText = event.location || '';

    // Parse start/end dates
    const startDate = new Date(`${event.date}T${event.startTime}`);
    const endDate = new Date(`${event.date}T${event.endTime}`);

    // Display date/time safely
    if (isNaN(startDate.getTime()) || isNaN(endDate.getTime())) {
      console.error('Invalid date/time in JSON:', event.date, event.startTime, event.endTime);
      document.getElementById('eventDate').innerText = event.date || '';
      document.getElementById('eventTime').innerText = `${event.startTime || ''} – ${event.endTime || ''}`;
      return;
    } else {
      const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
      document.getElementById('eventDate').innerText = startDate.toLocaleDateString('en-GB', options);
      document.getElementById('eventTime').innerText = `${event.startTime} – ${event.endTime}`;
    }

    // Map links
    const loc = encodeURIComponent(event.location || '');
    document.getElementById('googleMapLink').href = `https://www.google.com/maps/search/?api=1&query=${loc}`;
    document.getElementById('appleMapLink').href = `https://maps.apple.com/?q=${loc}`;

    // Calendar formatting
    const start = startDate.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
    const end = endDate.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');

    const title = encodeURIComponent(event.title || '');
    const desc = encodeURIComponent(`${event.subtitle || ''}\n${event.description || ''}`);
    const location = encodeURIComponent(event.location || '');

    // Web calendar links
    document.getElementById('googleLink').href =
      `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${desc}&location=${location}`;

    document.getElementById('outlookLink').href =
      `https://outlook.live.com/owa/?rru=addevent&subject=${title}&startdt=${encodeURIComponent(startDate.toISOString())}&enddt=${encodeURIComponent(endDate.toISOString())}&location=${location}&body=${desc}`;

    document.getElementById('officeLink').href =
      `https://outlook.office.com/owa/?path=/calendar/action/compose&subject=${title}&startdt=${encodeURIComponent(startDate.toISOString())}&enddt=${encodeURIComponent(endDate.toISOString())}&location=${location}&body=${desc}`;

    document.getElementById('yahooLink').href =
      `https://calendar.yahoo.com/?v=60&title=${title}&st=${start.replace('Z','')}&et=${end.replace('Z','')}&desc=${desc}&in_loc=${location}`;

    // Create ICS content for universal fallback download
    const icsContent = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Hull Red CIO//Event Calendar//EN',
      'BEGIN:VEVENT',
      `UID:${(event.title || 'event').replace(/\s+/g, '-').toLowerCase()}-${event.date}@hullred.github.io`,
      `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z')}`,
      `SUMMARY:${(event.title || '').replace(/\n/g, ' ')}`,
      `DESCRIPTION:${(`${event.subtitle || ''}\\n${event.description || ''}`).replace(/\n/g, '\\n')}`,
      `LOCATION:${(event.location || '').replace(/\n/g, ', ')}`,
      `DTSTART:${start}`,
      `DTEND:${end}`,
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');

    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);

    const safeFileName = `${(event.title || 'event').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_') || 'event'}.ics`;

    const appleLink = document.getElementById('appleLink');
    const icsLink = document.getElementById('icsLink');

    // Detect Apple devices
    const isAppleDevice =
      /Mac|iPhone|iPad|iPod/i.test(navigator.platform) ||
      /Mac|iPhone|iPad|iPod/i.test(navigator.userAgent);

    // APPLE BUTTON:
    // - Apple device: use hosted ICS file if you create data/event.ics
    // - Everyone else: use blob download fallback
    if (isAppleDevice) {
      appleLink.href = hostedIcsPath;
      appleLink.setAttribute('download', safeFileName);
      appleLink.setAttribute('target', '_blank');
    } else {
      appleLink.href = blobUrl;
      appleLink.setAttribute('download', safeFileName);
    }

    // ICS BUTTON: always universal download
    icsLink.href = blobUrl;
    icsLink.setAttribute('download', safeFileName);
  })
  .catch(err => {
    console.error(err);
  });
</script>

</body>
</html>
