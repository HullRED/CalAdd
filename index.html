<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hull Red CIO Event</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="nav-brand">
      <div class="nav-logo">
        <img src="public/HullRed2.png" alt="Hull Red CIO Logo">
      </div>
      <div class="nav-title">Hull Red CIO</div>
    </div>
    <nav class="nav-links">
      <a href="admin/index.html" class="admin-btn">Admin</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div class="panel">
      <div class="brand">
        <div class="logo">
          <img src="public/HullRed2.png" alt="Hull Red CIO Logo">
        </div>
        <div class="brand-text">
          <h1 id="eventTitle">Hull Red: Event Description</h1>
          <p class="subtitle" id="eventSubtitle">Add this event to your calendar</p>
        </div>
      </div>

      <div class="event-grid-map">
        <div class="event-details">
          <p><strong>Date:</strong> <span id="eventDate"></span></p>
          <p><strong>Time:</strong> <span id="eventTime"></span></p>
          <p><strong>Location:</strong> <span id="eventLocation"></span></p>
          <p id="eventDescription"></p>
          <p>
            <a id="googleMapLink" class="map-btn" target="_blank">Show on Google Maps</a>
            <a id="appleMapLink" class="map-btn" target="_blank">Show on Apple Maps</a>
          </p>
        </div>
      </div>

      <div class="calendar-actions">
        <a id="appleLink" class="calendar-btn"><img src="public/icons/apple.svg" alt="Apple"><span>Apple</span></a>
        <a id="googleLink" class="calendar-btn"><img src="public/icons/google.svg" alt="Google"><span>Google</span></a>
        <a id="officeLink" class="calendar-btn"><img src="public/icons/office365.svg" alt="Office 365"><span>Office 365</span></a>
        <a id="outlookLink" class="calendar-btn"><img src="public/icons/outlook.svg" alt="Outlook"><span>Outlook</span></a>
        <a id="yahooLink" class="calendar-btn"><img src="public/icons/yahoo.svg" alt="Yahoo"><span>Yahoo</span></a>
        <a id="icsLink" class="calendar-btn"><img src="public/icons/ics.svg" alt="ICS"><span>ICS</span></a>
      </div>
    </div>
  </section>

  <div class="footer">
    © 2026 Hull Red CIO • Event Calendar Page
  </div>
</main>

<script>
const basePath = 'data/event.json'; // relative path from HTML

fetch(basePath)
  .then(res => {
    if (!res.ok) throw new Error('Could not load event.json');
    return res.json();
  })
  .then(event => {
    // Fill event details
    document.getElementById('eventTitle').innerText = event.title;
    document.getElementById('eventSubtitle').innerText = event.subtitle;
    document.getElementById('eventDescription').innerText = event.description;
    document.getElementById('eventDate').innerText = event.date;
    document.getElementById('eventTime').innerText = event.time;
    document.getElementById('eventLocation').innerText = event.location;

    // Map links
    const loc = encodeURIComponent(event.location);
    document.getElementById('googleMapLink').href = `https://www.google.com/maps/search/?api=1&query=${loc}`;
    document.getElementById('appleMapLink').href = `https://maps.apple.com/?q=${loc}`;

    const [startStr, endStr] = event.time.replace('–','-').split('-').map(t => t.trim());
const startDate = new Date(`${event.date} ${startStr}`);
const endDate = new Date(`${event.date} ${endStr}`);

if (isNaN(startDate) || isNaN(endDate)) {
  console.error('Invalid date/time:', event.date, event.time);
} else {
  const start = startDate.toISOString().replace(/-|:|\.\d+/g,'');
  const end = endDate.toISOString().replace(/-|:|\.\d+/g,'');
  // ... continue setting calendar links
}
    
    const title = encodeURIComponent(event.title);
    const desc = encodeURIComponent(`${event.subtitle}\n${event.description}`);
    const location = encodeURIComponent(event.location);

    // Apple ICS
    document.getElementById('appleLink').href = `data:text/calendar;charset=utf8,BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:${title}
DESCRIPTION:${desc}
LOCATION:${location}
DTSTART:${start}
DTEND:${end}
END:VEVENT
END:VCALENDAR`;

    // Google Calendar
    document.getElementById('googleLink').href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${desc}&location=${location}`;

    // Outlook.com
    document.getElementById('outlookLink').href = `https://outlook.live.com/owa/?rru=addevent&subject=${title}&startdt=${start}&enddt=${end}&location=${location}&body=${desc}`;

    // Office 365
    document.getElementById('officeLink').href = `https://outlook.office.com/owa/?path=/calendar/action/compose&subject=${title}&startdt=${start}&enddt=${end}&location=${location}&body=${desc}`;

    // Yahoo
    document.getElementById('yahooLink').href = `https://calendar.yahoo.com/?v=60&title=${title}&st=${start}&et=${end}&desc=${desc}&in_loc=${location}`;

    // ICS download
    const icsLink = document.getElementById('icsLink');
    icsLink.href = document.getElementById('appleLink').href;
    icsLink.setAttribute('download', `${event.title}.ics`);
  })
  .catch(err => console.error(err));
</script>

</body>
</html>
