<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hull Red CIO Event</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="nav-brand">
      <div class="nav-logo">
        <img src="HullRed2.png" alt="Hull Red CIO Logo">
      </div>
      <div class="nav-title">Hull Red CIO</div>
    </div>
    <nav class="nav-links">
      <a href="./">Home</a>
      <a href="admin/">Admin</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div class="panel">
      <div class="brand">
        <div class="logo">
          <img src="HullRed2.png" alt="Hull Red CIO Logo">
        </div>
        <div class="brand-text">
          <h1 id="eventTitle">Loading event...</h1>
          <p class="subtitle" id="eventSubtitle"></p>
        </div>
      </div>

      <div class="event-grid-map">
        <div class="event-details">
          <p><strong>Date:</strong> <span id="eventDate"></span></p>
          <p><strong>Time:</strong> <span id="eventTime"></span></p>
          <p><strong>Location:</strong> <span id="eventLocation"></span></p>
          <p id="eventDescription"></p>
          <p><a id="mapLink" href="#" target="_blank">View on Google Maps</a></p>
        </div>
      </div>

      <div class="calendar-actions">
        <a class="calendar-btn" href="#"><img src="icons/apple.svg" alt="Apple"><span>Apple</span></a>
        <a class="calendar-btn" href="#"><img src="icons/google.svg" alt="Google"><span>Google</span></a>
        <a class="calendar-btn" href="#"><img src="icons/office365.svg" alt="Office 365"><span>Office 365</span></a>
        <a class="calendar-btn" href="#"><img src="icons/outlook.svg" alt="Outlook"><span>Outlook</span></a>
        <a class="calendar-btn" href="#"><img src="icons/yahoo.svg" alt="Yahoo"><span>Yahoo</span></a>
        <a class="calendar-btn" href="#"><img src="icons/ics.svg" alt="ICS"><span>ICS</span></a>
      </div>
    </div>
  </section>

  <div class="footer">
    © 2026 Hull Red CIO • Event Calendar Page
  </div>
</main>

<script>
(async function() {
  let event;
  try {
    const res = await fetch('../data/event.json');
    event = await res.json();
  } catch {
    // fallback if not running locally (GitHub Pages)
    event = {
      title: "Hull Red CIO Event",
      subtitle: "Add this event to your calendar",
      description: "Hull Red CIO event details can be updated manually in event.json",
      date: "Saturday, 30 May 2026",
      time: "18:00 – 21:00",
      location: "Hull, United Kingdom"
    };
  }

  document.getElementById('eventTitle').innerText = event.title;
  document.getElementById('eventSubtitle').innerText = event.subtitle;
  document.getElementById('eventDescription').innerText = event.description;
  document.getElementById('eventDate').innerText = event.date;
  document.getElementById('eventTime').innerText = event.time;
  document.getElementById('eventLocation').innerText = event.location;

  const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}`;
  document.getElementById('mapLink').href = mapUrl;
})();
</script>
</body>
</html>
